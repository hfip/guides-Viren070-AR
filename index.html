    function renderCodeBlock(code, lang = 'bash') {

        .replace(/</g, '&lt;')

      return `

          <pre id="${blockId}" class="p-3.5 text-xs font-mono text-slate-100 overflow-x-auto leading-relaxed">${escaped}</pre>
        </div>
      `;
    }

    // ==========================================
    // STATE MANAGEMENT & SAFE STORAGE
    // ==========================================
    let currentPageId = 'sh-overview';
    let completedSteps = {};

    function loadState() {
      try {
        const savedSteps = localStorage.getItem('viren070_ar_steps');
        if (savedSteps) completedSteps = JSON.parse(savedSteps);
        const savedTheme = localStorage.getItem('viren070_ar_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Fallback in sandboxed iframe
      }
    }

    function saveStepsState() {
      try {
        localStorage.setItem('viren070_ar_steps', JSON.stringify(completedSteps));
      } catch (e) {}
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-lg border border-indigo-400/30 transition-all duration-300';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    window.copyCodeById = function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const text = el.innerText || el.textContent;
      copyTextToClipboard(text);
    };

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('✅ تم نسخ النص إلى الحافظة بنجاح!');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ تم نسخ النص إلى الحافظة بنجاح!');
      } catch (e) {
        showToast('⚠️ تعذر النسخ التلقائي، يرجى النسخ يدوياً');
      }
      document.body.removeChild(ta);
    }

    // ==========================================
    // SIDEBAR & PAGE NAVIGATION
    // ==========================================
    const CATEGORIES_ORDER = [
      { key: 'home', label: '🏠 البداية' },
      { key: 'selfhosting', label: '🖥️ الاستضافة الذاتية (Self Hosting)' },
      { key: 'stremio', label: '🎬 البث و Stremio' },
      { key: 'aniyomi', label: '🎌 تطبيق Aniyomi' },
      { key: 'gaming', label: '🎮 الألعاب (Plutonium)' },
      { key: 'tools', label: '🛠️ أدوات تفاعلية' }
    ];

    function renderSidebar() {
      const treeEl = document.getElementById('sidebarNavTree');
      if (!treeEl) return;

      let html = '';
      CATEGORIES_ORDER.forEach(cat => {
        const catPages = PAGES.filter(p => p.category === cat.key);
        if (!catPages.length) return;
        html += `
          <div>
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-2 mb-1.5">${cat.label}</div>
            <div class="space-y-1">
              ${catPages.map(p => {
                const active = p.id === currentPageId;
                const done = !!completedSteps[p.id];
                return `
                  <button type="button" onclick="navigateTo('${p.id}')" class="w-full text-right px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between gap-2 transition-all ${
                    active
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                      : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80'
                  }">
                    <span class="truncate">${p.title}</span>
                    ${done ? '<span class="text-emerald-400 shrink-0" title="مكتمل">✓</span>' : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      treeEl.innerHTML = html;

      // Update Progress Bar
      const total = PAGES.length;
      const doneCount = PAGES.filter(p => completedSteps[p.id]).length;
      const pct = Math.round((doneCount / total) * 100);
      const pctEl = document.getElementById('sidebarProgressPct');
      const barEl = document.getElementById('sidebarProgressBar');
      if (pctEl) pctEl.textContent = pct + '% (' + doneCount + '/' + total + ')';
      if (barEl) barEl.style.width = pct + '%';

      // Update top navbar category pills
      const currentObj = PAGES.find(p => p.id === currentPageId) || PAGES[0];
      document.querySelectorAll('.cat-nav-btn').forEach(btn => {
        const btnCat = btn.getAttribute('data-cat-btn');
        if (btnCat === currentObj.category) {
          btn.className = 'cat-nav-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm';
        } else {
          btn.className = 'cat-nav-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/50';
        }
      });
    }

    window.toggleStepComplete = function(pageId) {
      completedSteps[pageId] = !completedSteps[pageId];
      saveStepsState();
      renderSidebar();
      renderCurrentPage();
      showToast(completedSteps[pageId] ? '✅ تم تعليم هذا القسم كمكتمل!' : '↩️ تمت إزالة علامة الاكتمال');
    };

    window.navigateTo = function(pageId) {
      const idx = PAGES.findIndex(p => p.id === pageId);
      if (idx === -1) return;
      currentPageId = pageId;
      closeMobileMenu();
      renderSidebar();
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function renderCurrentPage() {
      const idx = PAGES.findIndex(p => p.id === currentPageId);
      const page = PAGES[idx] || PAGES[0];
      const isDone = !!completedSteps[page.id];

      // Breadcrumb
      const trailEl = document.getElementById('breadcrumbTrail');
      if (trailEl) {
        trailEl.innerHTML = `
          <button type="button" onclick="navigateTo('home')" class="hover:text-indigo-500">الرئيسية</button>
          <span>/</span>
          <span class="text-slate-700 dark:text-slate-300">${page.categoryLabel}</span>
          <span>/</span>
          <span class="text-indigo-600 dark:text-indigo-400 font-bold">${page.title}</span>
        `;
      }

      const origLink = document.getElementById('currentOriginalUrl');
      if (origLink) origLink.href = page.originalUrl;

      // Render Page Content
      const container = document.getElementById('pageContent');
      if (container) {
        container.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
            <div>
              <div class="inline-flex items-center gap-2 text-xs font-bold text-indigo-600 dark:text-indigo-400 mb-1">
                <span>${page.categoryLabel}</span>
                <span>•</span>
                <span class="text-slate-400 font-normal">${page.updatedAt}</span>
              </div>
              <h1 class="text-xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">${page.title}</h1>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">${page.subtitle}</p>
            </div>
            <button type="button" onclick="toggleStepComplete('${page.id}')" class="shrink-0 inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition-all border ${
              isDone
                ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border-emerald-500/40'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-indigo-500'
            }">
              <span>${isDone ? '✅ مكتمل (اضغط للإلغاء)' : '⬜ تعليم هذا الدرس كمكتمل'}</span>
            </button>
          </div>
          ${page.render()}
        `;
      }

      // Render Pagination Footer
      const prevPage = idx > 0 ? PAGES[idx - 1] : null;
      const nextPage = idx < PAGES.length - 1 ? PAGES[idx + 1] : null;
      const footerEl = document.getElementById('paginationFooter');
      if (footerEl) {
        footerEl.innerHTML = `
          <div>
            ${prevPage ? `
              <button type="button" onclick="navigateTo('${prevPage.id}')" class="w-full text-right p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 transition-all group">
                <div class="text-[11px] text-slate-400 mb-1">→ الصفحة السابقة</div>
                <div class="text-sm font-extrabold text-indigo-600 dark:text-indigo-400 group-hover:underline">${prevPage.title}</div>
              </button>
            ` : ''}
          </div>
          <div>
            ${nextPage ? `
              <button type="button" onclick="navigateTo('${nextPage.id}')" class="w-full text-left p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 transition-all group">
                <div class="text-[11px] text-slate-400 mb-1">الصفحة التالية ←</div>
                <div class="text-sm font-extrabold text-indigo-600 dark:text-indigo-400 group-hover:underline">${nextPage.title}</div>
              </button>
            ` : ''}
          </div>
        `;
      }

      // Initialize interactive widgets if on interactive-tools page
      if (page.id === 'interactive-tools') {
        updateEnvGenerator();
        renderDebridTable();
      }
    }

    // ==========================================
    // PLATFORM TABS IN STREMIO SETUP
    // ==========================================
    window.switchPlatformTab = function(tabId) {
      document.querySelectorAll('.plat-tab-pane').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(tabId);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('.plat-tab-btn').forEach(btn => {
        if (btn.id === 'btn-' + tabId) {
          btn.className = 'plat-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white';
        } else {
          btn.className = 'plat-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300';
        }
      });
    };

    // ==========================================
    // INTERACTIVE TOOLS LOGIC
    // ==========================================
    window.updateEnvGenerator = function() {
      const ipEl = document.getElementById('genVpsIp');
      const domEl = document.getElementById('genDomain');
      const emailEl = document.getElementById('genEmail');
      const outEl = document.getElementById('generatedEnvOutput');
      if (!ipEl || !domEl || !emailEl || !outEl) return;

      const ip = ipEl.value.trim() || 'YOUR_VPS_IP';
      const domain = domEl.value.trim() || 'example.com';
      const email = emailEl.value.trim() || 'you@example.com';

      const selectedProfiles = [];
      document.querySelectorAll('.prof-chk:checked').forEach(chk => {
        selectedProfiles.push(chk.value);
      });

      const profilesStr = selectedProfiles.join(',');

      outEl.textContent = `# 1. الاتصال بالخادم وتثبيت Docker واستنساخ القالب:
ssh ubuntu@${ip}
curl -fsSL https://get.docker.com -o install-docker.sh && sudo sh install-docker.sh
cd /opt
sudo git clone https://github.com/Viren070/docker-compose-vps-template.git docker
sudo chown $(id -u):$(id -g) -R /opt/docker
cd /opt/docker

# 2. أهم المتغيرات التي تضعها داخل ملف /opt/docker/.env :
COMPOSE_PROFILES=${profilesStr}
DOMAIN=${domain}
ACME_EMAIL=${email}
TZ=Asia/Riyadh

# 3. تشغيل الخدمات الأساسية أولاً ثم باقي الخدمات:
docker compose --profile required up -d
docker compose up -d`;
    };

    window.copyDynamicConfig = function() {
      const outEl = document.getElementById('generatedEnvOutput');
      if (!outEl) return;
      copyTextToClipboard(outEl.textContent);
    };

    const DEBRID_PLANS = [
      { name: 'TorBox (Essential - 30 يوم)', usdPrice: 3.00, days: 30, multiIp: '✅ نعم (بدون قيود)' },
      { name: 'TorBox (Pro مع Usenet - سنوي)', usdPrice: 110.00, days: 365, multiIp: '✅ نعم (بدون قيود)' },
      { name: 'Real-Debrid (180 يوم)', usdPrice: 17.30, days: 180, multiIp: '❌ IP واحد في نفس اللحظة' },
      { name: 'Premiumize (شهر واحد)', usdPrice: 10.80, days: 30, multiIp: '✅ نعم (نظام النقاط)' },
      { name: 'AllDebrid (30 يوم)', usdPrice: 3.25, days: 30, multiIp: '❌ IP واحد' }
    ];

    window.renderDebridTable = function() {
      const sel = document.getElementById('currencySelector');
      const tbody = document.getElementById('debridComparisonBody');
      if (!sel || !tbody) return;

      const cur = sel.value;
      const rate = cur === 'SAR' ? 3.75 : (cur === 'EUR' ? 0.92 : 1.0);
      const sym = cur === 'SAR' ? ' ر.س' : (cur === 'EUR' ? ' €' : ' $');

      tbody.innerHTML = DEBRID_PLANS.map(p => {
        const planCost = (p.usdPrice * rate).toFixed(2);
        const monthlyCost = ((p.usdPrice / p.days) * 30 * rate).toFixed(2);
        const yearlyCost = ((p.usdPrice / p.days) * 365 * rate).toFixed(2);
        return `
          <tr>
            <td class="p-3 font-bold">${p.name}</td>
            <td class="p-3 font-mono">${planCost}${sym}</td>
            <td class="p-3 font-mono text-indigo-600 dark:text-indigo-400 font-bold">${monthlyCost}${sym}/شهر</td>
            <td class="p-3 font-mono">${yearlyCost}${sym}/سنة</td>
            <td class="p-3">${p.multiIp}</td>
          </tr>
        `;
      }).join('');
    };

    // ==========================================
    // GLOBAL SEARCH
    // ==========================================
    function setupSearch() {
      const input = document.getElementById('globalSearchInput');
      const box = document.getElementById('searchResultsBox');
      const list = document.getElementById('searchResultsList');
      const countText = document.getElementById('searchCountText');
      const closeBtn = document.getElementById('closeSearchBtn');

      if (!input || !box || !list) return;

      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if (!q) {
          box.classList.add('hidden');
          return;
        }
        const matches = PAGES.filter(p => {
          const hay = (p.title + ' ' + p.subtitle + ' ' + p.categoryLabel + ' ' + p.render()).toLowerCase();
          return hay.includes(q);
        });

        box.classList.remove('hidden');
        countText.textContent = `نتائج البحث (${matches.length})`;

        if (!matches.length) {
          list.innerHTML = `<div class="text-xs text-slate-500 p-2">لم يتم العثور على نتائج مطابقة لـ "${input.value}"</div>`;
          return;
        }

        list.innerHTML = matches.map(m => `
          <button type="button" onclick="navigateTo('${m.id}'); document.getElementById('searchResultsBox').classList.add('hidden');" class="w-full text-right p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors block">
            <div class="text-xs font-extrabold text-indigo-600 dark:text-indigo-400">${m.title}</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${m.subtitle}</div>
          </button>
        `).join('');
      });

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          box.classList.add('hidden');
          input.value = '';
        });
      }
    }

    // ==========================================
    // MOBILE DRAWER & THEME TOGGLE
    // ==========================================
    function openMobileMenu() {
      const sb = document.getElementById('sidebarContainer');
      const bd = document.getElementById('mobileBackdrop');
      if (sb) sb.classList.remove('translate-x-full');
      if (bd) bd.classList.remove('hidden');
    }

    function closeMobileMenu() {
      const sb = document.getElementById('sidebarContainer');
      const bd = document.getElementById('mobileBackdrop');
      if (sb) sb.classList.add('translate-x-full');
      if (bd) bd.classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderSidebar();
      renderCurrentPage();
      setupSearch();

      // Category buttons in top navbar
      document.querySelectorAll('.cat-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.getAttribute('data-cat-btn');
          const firstPage = PAGES.find(p => p.category === cat);
          if (firstPage) navigateTo(firstPage.id);
        });
      });

      // Brand button -> Home
      const brandBtn = document.getElementById('brandHomeBtn');
      if (brandBtn) brandBtn.addEventListener('click', () => navigateTo('home'));

      // Mobile menu
      const mobBtn = document.getElementById('mobileMenuBtn');
      const mobBd = document.getElementById('mobileBackdrop');
      if (mobBtn) mobBtn.addEventListener('click', openMobileMenu);
      if (mobBd) mobBd.addEventListener('click', closeMobileMenu);

      // Theme toggle
      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          try {
            localStorage.setItem('viren070_ar_theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        });
      }
    });
  </script>
</body>
</html>
